name: Sync Documentation

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 时间 0:00 触发一次
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v3
        with:
          repository: CyrusZhou-CN/dbeaver.wiki
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          
      - name: Authenticate with GitHub CLI
        run: |
          echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token
      - name: Add and fetch from remote repository
        run: |
          REMOTE_REPO="dbeaver/dbeaver.wiki"
          
          # 添加远程仓库
          REMOTE_URL="https://github.com/$REMOTE_REPO.git"
          git remote add upstream $REMOTE_URL
          
          # 获取远程分支和标签
          git fetch upstream --tags
          git push --tags --progress "origin" --force
      - name: Sync all branches
        run: |
          git push --all --progress  -- "CyrusZhou-CN"

      - name: Push tags to own repo
        run: |
          git remote update --prune
      - name: Cleanup
        run: |
          git gc --auto
